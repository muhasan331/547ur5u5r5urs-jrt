<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b080f">
  <title>قلب فاطمة</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #3b080f;
      --paper: #fff0d7;
      --red: #ff3b45;
      --gold: #f4c878;
      --mint: #f5b7b0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--paper);
      background:
        radial-gradient(ellipse at 50% 44%, #64101c 0, transparent 48%),
        radial-gradient(circle at 50% 50%, rgb(255 59 69 / 8%) 1px, transparent 1.5px) 0 0 / 28px 28px,
        #19070b;
      font-family: Georgia, "Noto Naskh Arabic", "Traditional Arabic", serif;
    }

    main {
      width: min(100%, 760px);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      text-align: center;
    }

    .composition {
      position: relative;
      width: min(100%, 610px);
      aspect-ratio: 1 / 1.02;
      display: grid;
      place-items: center;
      isolation: isolate;
      flex: 0 1 auto;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .message {
      position: relative;
      z-index: 1;
      width: min(68%, 340px);
      padding: 0;
      text-shadow: 0 2px 8px rgb(25 7 11 / 95%), 0 0 2px #19070b;
      animation: arrive 900ms 250ms both;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--gold);
      font: 600 11px/1.5 Arial, sans-serif;
      letter-spacing: 2.5px;
      direction: ltr;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--paper);
      font-size: clamp(34px, 8vw, 58px);
      font-weight: 500;
      line-height: 1.2;
    }

    .dedication {
      margin: 8px 0 0;
      color: var(--paper);
      font-size: clamp(20px, 5vw, 28px);
      line-height: 1.4;
      white-space: nowrap;
    }

    .friend-note {
      display: block;
      margin-top: 3px;
      color: var(--gold);
      font: 600 10px/1.5 Arial, sans-serif;
      letter-spacing: 2px;
      direction: ltr;
    }

    .caption {
      position: absolute;
      bottom: 3%;
      margin: 0;
      color: var(--mint);
      font-size: 15px;
      animation: arrive 900ms 1s both;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 18px;
      width: min(100%, 480px);
      padding: 2px 0 8px;
      color: var(--paper);
      font: 13px/1.5 Arial, sans-serif;
    }

    .control-button {
      min-height: 40px;
      padding: 0 15px;
      border: 1px solid rgb(255 240 215 / 36%);
      border-radius: 5px;
      color: var(--paper);
      background: rgb(65 12 21 / 82%);
      font: inherit;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .control-button:hover {
      border-color: var(--red);
      background: #681320;
    }

    .control-button:active { transform: scale(.97); }
    .control-button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      direction: rtl;
    }

    .speed-control input { width: 88px; accent-color: var(--red); }
    .speed-value { min-width: 34px; color: var(--gold); direction: ltr; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .composition { width: min(100%, 430px); }
      .message { width: 72%; padding: 16px 10px 17px; }
      .caption { bottom: 4%; font-size: 13px; }
      .controls { gap: 8px 12px; font-size: 12px; }
      .control-button { min-height: 38px; padding: 0 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="composition" aria-label="قلب من كلمات بلغات متعددة إلى فاطمة">
      <canvas id="heart" aria-hidden="true"></canvas>
      <div class="message">
        <p class="eyebrow">A little note for</p>
        <h1></h1>I LOVE YOU </h1>
        <p class="dedication" dir="rtl"><span>أحبك كـ</span> <bdi dir="ltr">Friend</bdi></p>
        <span class="friend-note">AS A FRIEND</span>
      </div>
      <p class="caption">كلمات من حول العالم، كتبتها لكِ بكل محبة</p>
    </section>
    <div class="controls" aria-label="التحكم بكتابة القلب">
      <button class="control-button" id="toggle" type="button">إيقاف الكتابة</button>
      <button class="control-button" id="restart" type="button">إعادة من البداية</button>
      <label class="speed-control" for="speed">
        <span>السرعة</span>
        <input id="speed" type="range" min="0.5" max="2.5" step="0.5" value="1">
        <output class="speed-value" id="speed-value" for="speed">1×</output>
      </label>
    </div>
  </main>
  <script>
    const canvas = document.querySelector("#heart");
    const context = canvas.getContext("2d");
    const toggleButton = document.querySelector("#toggle");
    const restartButton = document.querySelector("#restart");
    const speedInput = document.querySelector("#speed");
    const speedValue = document.querySelector("#speed-value");
    const phrases = [
      "أحبك يا صديقتي", "Love you, my friend", "Je t'aime, mon amie",
      "Te quiero, amiga", "Gosto de ti, amiga", "Ti voglio bene, amica",
      "Ich hab dich lieb", "Ik geef om jou, vriendin", "Canım arkadaşım",
      "Swahili: nakupenda, rafiki", "मैं तुमसे प्यार करती हूँ, दोस्त",
      "دوستت دارم، دوست خوبم", "أحبك كصديقة", "友達として大好きだよ",
      "친구로서 정말 사랑해", "我爱你，我的朋友", "Люблю тебя, мой друг",
      "Σε αγαπώ, φίλη μου", "รักเธอนะ เพื่อนรัก", "বন্ধু, তোমাকে ভালোবাসি",
      "Mahal kita, kaibigan", "Aku sayang kamu, sahabat", "Te iubesc, prietena mea",
      "Kocham cię, przyjaciółko", "Jag tycker om dig, min vän", "אני אוהבת אותך, חברה",
      "Mo nifẹ rẹ, ọ̀rẹ́ mi", "Seni seviyorum, arkadaşım", "You make friendship beautiful"
    ];
    const colors = ["#fff0d7", "#ffd1d1", "#ffc0b9", "#ffe0a6"];
    let elapsed = 0;
    let previousFrame;
    let isPlaying = true;
    let hasFinished = false;
    let animationFrame;

    function heartPath(width, height) {
      const path = new Path2D();
      for (let step = 0; step <= 240; step++) {
        const angle = (step / 240) * Math.PI * 2;
        const x = 16 * Math.sin(angle) ** 3;
        const y = 13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle);
        const px = width / 2 + (x / 17) * width * .46;
        const py = height * .48 - (y / 17) * height * .46;
        step === 0 ? path.moveTo(px, py) : path.lineTo(px, py);
      }
      path.closePath();
      return path;
    }

    function draw(time) {
      if (previousFrame === undefined) previousFrame = time;
      const delta = Math.min((time - previousFrame) / 1000, .05);
      previousFrame = time;
      if (isPlaying && !hasFinished) elapsed += delta * Number(speedInput.value);
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
      }
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, width, height);

      const path = heartPath(width, height);
      const heartFill = context.createLinearGradient(0, height * .08, width, height * .9);
      heartFill.addColorStop(0, "#ff5265");
      heartFill.addColorStop(.48, "#e31332");
      heartFill.addColorStop(1, "#8b071d");
      context.save();
      context.shadowColor = "rgba(255, 26, 56, .55)";
      context.shadowBlur = Math.max(18, width * .055);
      context.fillStyle = heartFill;
      context.fill(path);
      context.restore();

      context.save();
      context.clip(path);

      const progress = Math.min(1, elapsed / 12);
      const rowHeight = Math.max(23, Math.min(29, width / 19));
      const rowCount = Math.ceil(height / rowHeight);
      const revealedRows = Math.ceil(rowCount * progress);
      const fontSize = Math.max(12, Math.min(17, width / 32));
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.direction = "ltr";

      for (let row = 0; row < revealedRows; row++) {
        const y = row * rowHeight + rowHeight / 2;
        const phrase = phrases[row % phrases.length];
        const reveal = row === revealedRows - 1 && progress < 1
          ? Math.max(0, progress * rowCount - row)
          : 1;
        let inside = 0;
        let outside = width * .46;
        for (let attempt = 0; attempt < 9; attempt++) {
          const midpoint = (inside + outside) / 2;
          if (context.isPointInPath(path, width / 2 - midpoint, y)) inside = midpoint;
          else outside = midpoint;
        }

        const availableWidth = inside * 2;
        context.save();
        context.beginPath();
        context.rect(width * (1 - reveal) / 2, 0, width * reveal, height);
        context.clip();
        context.fillStyle = colors[row % colors.length];
        context.globalAlpha = .94;
        context.font = `${fontSize}px Georgia, "Noto Naskh Arabic", serif`;
        const phraseWidth = context.measureText(phrase).width;
        const rowFontSize = Math.min(fontSize, fontSize * (availableWidth - 12) / phraseWidth);

        if (rowFontSize >= 9) {
          context.font = `${rowFontSize}px Georgia, "Noto Naskh Arabic", serif`;
          const measuredWidth = context.measureText(phrase).width;
          const gap = Math.max(16, rowFontSize * 1.4);
          const spacing = measuredWidth + gap;
          const copies = Math.max(1, Math.floor((availableWidth + gap) / spacing));
          for (let copy = 0; copy < copies; copy++) {
            const x = width / 2 + (copy - (copies - 1) / 2) * spacing;
            context.fillText(phrase, x, y);
          }
        }
        context.restore();
      }
      context.restore();

      context.strokeStyle = "rgba(255, 59, 69, .95)";
      context.lineWidth = 2;
      context.shadowColor = "rgba(255, 35, 52, .78)";
      context.shadowBlur = 14;
      context.stroke(path);

      if (progress >= 1 && !hasFinished) {
        hasFinished = true;
        isPlaying = false;
        toggleButton.textContent = "تشغيل من جديد";
      }
      animationFrame = requestAnimationFrame(draw);
    }

    toggleButton.addEventListener("click", () => {
      if (hasFinished) {
        elapsed = 0;
        hasFinished = false;
      }
      isPlaying = !isPlaying;
      toggleButton.textContent = isPlaying ? "إيقاف الكتابة" : "متابعة الكتابة";
    });

    restartButton.addEventListener("click", () => {
      elapsed = 0;
      hasFinished = false;
      isPlaying = true;
      toggleButton.textContent = "إيقاف الكتابة";
    });

    speedInput.addEventListener("input", () => {
      speedValue.value = `${speedInput.value}×`;
      speedValue.textContent = speedValue.value;
    });

    new ResizeObserver(() => {
      previousFrame = undefined;
      cancelAnimationFrame(animationFrame);
      animationFrame = requestAnimationFrame(draw);
    }).observe(canvas);
    animationFrame = requestAnimationFrame(draw);
  </script>
</body>
</html>
